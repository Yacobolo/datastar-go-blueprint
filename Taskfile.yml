version: "3"

env:
  STATIC_DIR: web/resources/static

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # ====================
  # Code Generation (generate:*)
  # ====================
  # These tasks generate Go code from source files:
  # - generate:sqlc  : *.sql → type-safe queries
  # ====================

  # ====================
  # Asset Bundling (build:web:*)
  # ====================
  # These tasks bundle frontend assets for deployment
  # ====================

  build:web:css:
    desc: Build Tailwind + DaisyUI CSS
    sources:
      - web/ui/styles/main.css
      - web/package.json
      - web/pnpm-lock.yaml
      - internal/ui/**/*.go
      - web/ui/components/**/*.ts
      - web/ui/src/**/*.ts
    generates:
      - web/resources/static/styles.css
    cmds:
      - pnpm --dir web exec tailwindcss -i ./ui/styles/main.css -o ./resources/static/styles.css --minify

  build:web:js:
    desc: Bundle frontend JavaScript with esbuild
    sources:
      - web/ui/components/**/*.ts
      - web/ui/libs/**/*.ts
      - web/ui/src/**/*.ts
    generates:
      - web/resources/static/libs/*.js
      - web/resources/static/theme-switcher.js
    cmds:
      - go run -tags=dev cmd/server/build/main.go

  build:web:assets:
    desc: Bundle all web assets (Tailwind CSS + JS/TS)
    deps:
      - build:web:css
      - build:web:js

  # ====================
  # Production Build
  # ====================

  build:
    desc: Build production binary
    deps:
      - generate:all
      - build:web:assets
    cmds:
      - go build -o bin/server cmd/server/main.go

  # ====================
  # Development Commands
  # ====================

  dev:
    desc: Start development with worktree-specific ports and state
    deps:
      - generate:all
      - build:web:assets
    cmds:
      - |
        worktree_path="$(pwd -P)"
        checksum="$(printf '%s' "$worktree_path" | cksum | awk '{print $1}')"
        offset=$((checksum % 1000))

        mkdir -p ./.codex/dev

        export PORT="${PORT:-$((8080 + offset))}"
        export NATS_PORT="${NATS_PORT:-$((4222 + offset))}"
        export DB_PATH="${DB_PATH:-./.codex/dev/todos_${offset}.db}"
        export SESSION_NAME="${SESSION_NAME:-connections_${offset}}"
        export SESSION_SECRET="${SESSION_SECRET:-dev-session-${checksum}}"

        echo "Starting dev environment for ${worktree_path}"
        echo "  App URL:        http://localhost:${PORT}"
        echo "  NATS URL:       nats://localhost:${NATS_PORT}"
        echo "  SQLite DB:      ${DB_PATH}"
        echo "  Session cookie: ${SESSION_NAME}"

        hivemind Procfile.dev

  dev:stop:
    desc: Stop running development processes
    cmds:
      - pkill -f "hivemind Procfile.dev" || true

  dev:restart:
    desc: Restart development processes
    cmds:
      - task: dev:stop
      - task: dev

  # ====================
  # Code Generation - Combined
  # ====================

  generate:all:
    desc: Run all code generators (sqlc)
    deps:
      - generate:sqlc

  generate:sqlc:
    desc: Generate type-safe database code from SQL
    sources:
      - internal/store/queries/*.sql
      - internal/store/migrations/*.sql
    generates:
      - internal/store/queries/*.go
    cmds:
      - sqlc generate

  # ====================
  # Database Commands
  # ====================

  db:reset:
    desc: Reset database (DESTRUCTIVE)
    prompt: This will delete all data. Continue?
    cmds:
      - rm -f data/*.db data/*.db-*
      - echo "Database reset complete"

  # ====================
  # Testing & Linting
  # ====================

  test:
    desc: Run all tests (package summary, shows failures inline)
    cmds:
      - gotestsum --format pkgname-and-test-fails -- ./...

  test:coverage:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  lint:
    desc: Run Go linters
    cmds:
      - golangci-lint run

  check:web:types:
    desc: Type-check frontend TypeScript
    cmds:
      - pnpm --dir web run build

  check:
    desc: Run tests, lint, and asset builds (shows all errors)
    ignore_error: true
    cmds:
      - task: test
      - task: lint
      - task: check:web:types
      - task: build:web:assets

  # ====================
  # Cleanup
  # ====================

  clean:
    desc: Clean generated files and build artifacts
    cmds:
      - rm -rf bin/
      - rm -rf tmp/
      - rm -rf web/resources/static/*

  # ====================
  # Tools Installation
  # ====================

  tools:install:
    desc: Install development tools
    cmds:
      - go install github.com/air-verse/air@latest
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install github.com/DarthSim/hivemind@latest
      - go install gotest.tools/gotestsum@latest

  tools:check:
    desc: Check if required tools are installed
    cmds:
      - |
        for tool in air sqlc golangci-lint hivemind gotestsum pnpm; do
          if command -v $tool &> /dev/null; then
            echo "✓ $tool installed"
          else
            echo "✗ $tool missing - run 'task tools:install'"
          fi
        done
